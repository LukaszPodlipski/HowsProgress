name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - production
    tags:
      - 'v*'
    paths-ignore:
      - 'public/downloads/latest.json'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release metadata
        id: release
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            DISPLAY_VERSION="${TAG#v}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            TAG="desktop-v${VERSION}-build${{ github.run_number }}"
            DISPLAY_VERSION="${VERSION}-build${{ github.run_number }}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Hows Progress ${{ steps.release.outputs.display_version }}
          releaseBody: Automated desktop build for Windows.
          releaseDraft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          args: '--target x86_64-pc-windows-msvc'

      - name: Resolve installer download URL
        id: installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" `
            -Headers $headers

          $asset = $release.assets | Where-Object { $_.name -like '*-setup.exe' } | Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets | Where-Object { $_.name -like '*.msi' } | Select-Object -First 1
          }

          if (-not $asset) {
            throw "No installer asset found on release $tag"
          }

          "filename=$($asset.name)" >> $env:GITHUB_OUTPUT
          "url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Update latest.json
        run: >
          node scripts/update-latest-download.mjs
          --version "${{ steps.release.outputs.display_version }}"
          --url "${{ steps.installer.outputs.url }}"
          --filename "${{ steps.installer.outputs.filename }}"

      - name: Commit latest.json to production
        shell: bash
        run: |
          cp public/downloads/latest.json /tmp/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin production
          git checkout production
          git pull --ff-only origin production
          cp /tmp/latest.json public/downloads/latest.json
          git add public/downloads/latest.json
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: update desktop download metadata"
          git push origin production
