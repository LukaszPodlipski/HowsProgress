name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - production
    tags:
      - 'v*'
    paths-ignore:
      - 'public/downloads/latest.json'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      display_version: ${{ steps.release.outputs.display_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release metadata
        id: release
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            DISPLAY_VERSION="${TAG#v}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            TAG="desktop-v${VERSION}-build${{ github.run_number }}"
            DISPLAY_VERSION="${VERSION}-build${{ github.run_number }}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: ''
          - platform: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish desktop installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Hows Progress ${{ needs.prepare.outputs.display_version }}
          releaseBody: Automated desktop builds for Windows and macOS.
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          args: '--target ${{ matrix.target }}'

  publish-metadata:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node scripts/sync-latest-download-from-release.mjs
          --version "${{ needs.prepare.outputs.display_version }}"
          --tag "${{ needs.prepare.outputs.tag }}"

      - name: Commit latest.json to production
        run: |
          cp public/downloads/latest.json /tmp/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin production
          git checkout production
          git pull --ff-only origin production
          cp /tmp/latest.json public/downloads/latest.json
          git add public/downloads/latest.json
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: update desktop download metadata"
          git push origin production
